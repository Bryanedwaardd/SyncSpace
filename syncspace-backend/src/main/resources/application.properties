spring.application.name=syncspace-backend

server.port = 8080

#koneksi ke database (syncspace_db)
spring.datasource.url = jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:syncspace_db}
spring.datasource.username = ${DB_USER:postgres}
spring.datasource.password = ${DB_PASS:postgres}

#validasi otomatis antara entity java dan table postgresql
spring.jpa.hibernate.ddl-auto = validate 

#memprint sql di terminal supaya mudah debugging
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

#url microservice ML
ml.service.url = http://localhost:8000

# Mengambil nilai dari Environment Variable bernama JWT_SECRET
jwt.secret=${JWT_SECRET}